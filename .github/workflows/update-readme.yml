name: Update README with latest blog posts

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 6am UTC
  workflow_dispatch:        # manual trigger anytime
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest dev.to posts
        id: fetch
        run: |
          # fetch your dev.to articles via their API
          ARTICLES=$(curl -s "https://dev.to/api/articles?username=aniket_misra_e47d1564ab7b&per_page=3" \
            -H "Accept: application/json")
          
          # build the markdown block
          BLOCK="<!-- BLOG-POST-LIST:START -->"$'\n'
          
          while IFS= read -r line; do
            TITLE=$(echo "$line" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['title'])")
            URL=$(echo "$line" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['url'])")
            DATE=$(echo "$line" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['published_at'][:10])")
            BLOCK+="- [${TITLE}](${URL}) — \`${DATE}\`"$'\n'
          done < <(echo "$ARTICLES" | python3 -c "
          import sys, json
          articles = json.load(sys.stdin)
          for a in articles:
              print(json.dumps(a))
          ")
          
          BLOCK+="<!-- BLOG-POST-LIST:END -->"
          
          # escape for multiline GitHub output
          echo "block<<EOF" >> $GITHUB_OUTPUT
          echo "$BLOCK" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          python3 << 'PYEOF'
          import re

          with open('README.md', 'r') as f:
              content = f.read()

          new_block = """${{ steps.fetch.outputs.block }}"""

          updated = re.sub(
              r'<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->',
              new_block,
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(updated)

          print("README updated")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update blog posts [skip ci]"
          git push
