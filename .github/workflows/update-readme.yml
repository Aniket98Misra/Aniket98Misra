name: Update README with latest blog posts

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and inject latest dev.to posts
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import re

          url = "https://dev.to/api/articles?username=aniket_misra_e47d1564ab7b&per_page=3"
          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=10) as r:
              articles = json.loads(r.read().decode())

          lines = ["<!-- BLOG-POST-LIST:START -->"]
          for a in articles:
              date = a["published_at"][:10]
              lines.append(f"- [{a['title']}]({a['url']}) — `{date}`")
          lines.append("<!-- BLOG-POST-LIST:END -->")
          new_block = "\n".join(lines)

          with open("README.md", "r") as f:
              content = f.read()

          updated = re.sub(
              r"<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->",
              new_block,
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(updated)

          print("done")
          print(new_block)
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: update blog posts [skip ci]"
          git push